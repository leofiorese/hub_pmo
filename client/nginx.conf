server {
    listen 7001;
    server_name localhost;

    # Desabilitar trailing slash automático
    absolute_redirect off;
    port_in_redirect off;

    # Servir frontend no subdomínio /pmohub
    location /pmohub/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/index.html /pmohub/index.html;
    }

    # Remover trailing slash se existir (exceto para /pmohub/)
    location = /pmohub {
        return 301 $scheme://$http_host/pmohub/;
    }

    # Fallback para a raiz (redirecionar para /pmohub)
    location = / {
        return 301 $scheme://$http_host/pmohub/;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}
