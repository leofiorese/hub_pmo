
#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Definição do Upstream (Backend Load Balanced via PM2)
    upstream backend_node {
        server 127.0.0.1:3000;
        # Se tivesse mais IPs ou Portas, adicionaria aqui
        # keepalive 64; 
    }

    server {
        listen       80;
        server_name  localhost 192.168.16.48; # Responde pelo IP também

        # 1. Frontend: Servir Arquivos Estáticos (React Build)
        location / {
            # === ATENÇÃO: ALTERE ESTE CAMINHO NA VM ===
            # Caminho ABSOLUTO para a pasta dist do seu projeto na VM
            # Ex: C:/Users/Administrator/Documents/hub_pmo/client/dist
            root   "C:/Users/leonardo.fiorese/Documents/hub_pmo/client/dist";
            index  index.html index.htm;
            
            # React Router: Se não achar arquivo/pasta, manda pro index.html
            try_files $uri $uri/ /index.html;
        }

        # 2. Backend: Reverse Proxy para a API
        location /api {
            proxy_pass http://backend_node; # Manda para o upstream definido acima
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Opcional: headers para repassar IP real
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Página de erro padrão
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
